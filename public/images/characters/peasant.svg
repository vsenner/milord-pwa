<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2d1f14" />
      <stop offset="70%" stop-color="#140d07" />
      <stop offset="100%" stop-color="#070402" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#aa7c11" />
      <stop offset="100%" stop-color="#5a4106" />
    </linearGradient>
    <filter id="parchment">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDiffuseLighting in="noise" lighting-color="#eedc9a" surfaceScale="2">
        <feDistantLight azimuth="45" elevation="60" />
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="500" fill="url(#bgGrad)" />

  <!-- Outer Ornate Medieval Border -->
  <rect x="15" y="15" width="370" height="470" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
  <rect x="25" y="25" width="350" height="450" rx="10" fill="none" stroke="#4a3520" stroke-width="2" stroke-dasharray="8 4" />

  <!-- Corner Fleur-de-lis / Accents -->
  <path d="M 20 50 L 50 20 L 35 35 Z" fill="#aa7c11" />
  <path d="M 380 50 L 350 20 L 365 35 Z" fill="#aa7c11" />
  <path d="M 20 450 L 50 480 L 35 465 Z" fill="#aa7c11" />
  <path d="M 380 450 L 350 480 L 365 465 Z" fill="#aa7c11" />

  <!-- Arch Frame -->
  <path d="M 60 420 L 60 170 C 60 70 340 70 340 170 L 340 420 Z" fill="#1b120a" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Center Character Symbol / Illustration -->
  <g transform="translate(200, 230)">
    
<path d="M -40 30 L 40 30 L 50 120 L -50 120 Z" fill="#422e1b" stroke="#26190d" stroke-width="3"/>
<circle cx="0" cy="-25" r="36" fill="#61462b" stroke="#362211" stroke-width="3"/>
<path d="M -40 -15 C -20 -80 30 -60 40 -15" fill="none" stroke="#d4af37" stroke-width="8" stroke-linecap="round"/>
<path d="M -15 60 L 15 20 L 25 30 L -5 70 Z" fill="#c0c0c0" stroke="#555" stroke-width="2"/>
<path d="M -30 90 L 30 10 L 0 50 Z" fill="#daa520"/>

  </g>

  <!-- Banner Plate -->
  <path d="M 70 410 L 330 410 L 310 455 L 90 455 Z" fill="#47311c" stroke="url(#goldGrad)" stroke-width="3" />
  <text x="200" y="440" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#f5e6b8" text-anchor="middle" letter-spacing="2">
    СТАРОСТА ФОМА
  </text>
</svg>